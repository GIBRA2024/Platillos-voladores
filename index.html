<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servicio desactivado</title>
    <style>
        :root { color-scheme: light; }
        body{
            margin:0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background:#ffffff;
            color:#111;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }
        main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:24px;
        }
        h1{
            margin:0;
            font-size: clamp(28px, 5vw, 56px);
            line-height:1.1;
            font-weight:800;
            letter-spacing:-0.02em;
        }
        .subtitle{
            margin-top:14px;
            font-size: clamp(16px, 2.2vw, 22px);
            color:#444;
            font-weight:600;
        }
        footer{
            padding:18px 24px;
            border-top:1px solid #eee;
            text-align:center;
            font-size:16px;
            color:#222;
        }
        a{
            color:inherit;
            text-decoration:none;
            font-weight:700;
        }
        a:hover{ text-decoration:underline; }
    </style>
</head>

<body>
<main>
    <div>
        <h1>Servicio desactivado</h1>
        <div class="subtitle">Por favor contactar con Gibra Company</div>
    </div>
</main>

<footer>
    Teléfono de contacto:
    <a href="tel:+573225725739">+57 3225725739</a>
</footer>
</body>
</html>
